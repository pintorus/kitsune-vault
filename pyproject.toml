[project]
name = "kitsune-vault"
version = "0.1.0"
description = "Synchro à sens unique des mots de passe Firefox vers une base KeePassXC"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["pykeepass>=4.0"]

[project.scripts]
kitsune-vault = "kitsune_vault.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["kitsune_vault"]
