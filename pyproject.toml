[project]
name = "kitsune-vault"
version = "0.1.0"
description = "One-way sync of Firefox saved passwords into a KeePassXC database"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["pykeepass>=4.0", "keyring>=24"]

[project.scripts]
kitsune-vault = "kitsune_vault.cli:main"

[project.gui-scripts]
kitsune-vault-gui = "kitsune_vault.gui:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["kitsune_vault"]

[tool.setuptools.package-data]
kitsune_vault = ["assets/*.png", "assets/*.svg", "gnome_extension/*"]
